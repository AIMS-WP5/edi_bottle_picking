debug: true
iterations: 5
pose_from_topic: false
pose_topic_name: "const_pose"
default_controller: "joint_trajectory_controller" # scaled_joint_trajectory_controller for real robot

# --- Named SRDF poses (edi_ur/edi_moveit_config/srdf/ur5e_macro.srdf.xacro) ---------------
# There are TWO incompatible box-approach pose sets, one per physical cell, and they put the
# tool on OPPOSITE SIDES of the robot (tool0 y ~ +0.5 vs ~ -0.47). Picking the wrong one does
# not fail cleanly -- the arm sweeps to the other side and finds no bottle -- so the resolved
# set is logged once at startup.
#   defaults below = the "edi" set: the real EDI cell, and equally robo-codegen-edi's sim bin.
#   legacy "isaac" set = wait_slam / above_box_1 / ai_after_pickup: the edi_isaacsim scene's
#   box. edi_isaacsim is being DEPRECATED in favour of robo-codegen-edi; select that set with
#   the launch arg `pose_set:=isaac` (what bringup_sim_stack.sh passes) rather than editing
#   these keys. Ground truth for both sets: robo-codegen-edi ur5e_common.py
#   NAMED_JOINT_CONFIG_EE_POSES.
pose_initial: "near_box"            # one-time startup/home pose before the iteration loop
pose_above_box: "above_box_2"       # staging pose above the pick box (approach + retreat)
pose_after_pickup: "near_box"       # transit pose after a successful pick / insert cleanup
# Canonical DP hand-off configuration. NOT swapped by pose_set and should not be changed: the
# DP policy was trained from this exact configuration and it seeds the moveit-mode insertion IK.
pose_dp_handoff: "ai_start2"
pose_retreat_fallback: "near_box"   # safe_retreat() last resort when pose_above_box is unreachable
pose_dropoff: "inter_floor_4"       # where a bottle is dumped after a failed insertion

# Backend flags (tri-state: auto | "true" | "false"; launch arg overrides these).
# simulation: "true" = Isaac Sim is the primary plant (skip UR /set_io vacuum, trust sim
#   grasp status, flip Isaac drive gains); "false" = real robot / URSim. auto (default)
#   falls back to the use_sim_time heuristic with a one-time WARN -- set explicitly for
#   bag-replay/Gazebo/hybrid deployments.
# mirror_to_isaac: forward vacuum commands to Isaac's /vacuum_gripper/command bridge.
#   auto (default) follows the resolved simulation value; hybrid bring-ups (URSim/real
#   primary + Isaac follower) set "true" explicitly.
simulation: auto
mirror_to_isaac: auto
