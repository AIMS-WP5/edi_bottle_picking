debug: true
iterations: 50
max_pick_attempts: 3   # retries for a failed pick (each failed attempt does a safe retreat first); 1 = no retry
grasp_pose_topic: "best_grasp"
default_controller: "joint_trajectory_controller" # scaled_joint_trajectory_controller for real robot

# Insertion strategy for the segment that places the bottle into the socket:
#   "dp"     -> NN velocity-control segment (ControlModeSwitcher::run_dp_segment); default.
#   "moveit" -> comparison test: a MoveIt-planned move above socket_center+offset, then a
#               straight Cartesian descent. No driver switch, no sent/received velocity logging.
# Overridable via the conveyor_feeding.launch.py 'insertion_mode' arg.
insertion_mode: "dp"
socket_pose_topic: "socket_center"   # PoseStamped (world frame) carrying the insertion target
# MoveIt-mode only: EE target = socket_center + this offset (world XYZ, metres), reusing the
# current (held-bottle) wrist orientation. Calibrate once with PAD_ADJ_X/Y = 0 so it is
# pure bottle/gripper geometry (independent of any DP model version). See docs / plan.
# tool-tip-305 (2026-08-08): x 0.015 -> 0.0187 = the analytic radial_overhang under the
# corrected tip (r 0.0176 + seat_cup_stretch 0.0011; the old 0.015 was the same derivation
# with the now-removed 3.7 mm "compliance" term, calibrated on the retired edi_isaacsim
# scene). Keeps the derived-equals-fixed regression anchor true; recalibrate on the real
# cell from this analytic starting point.
moveit_insert_offset_xyz: [0.0187, 0.0, 0.09]
moveit_insert_above_dz: 0.10          # height above the insert pose for the MoveIt approach (m)
# Fixed end-effector (virtual_ee_link) orientation for the insertion, world frame, [x,y,z,w].
# Chosen so the gripper is HORIZONTAL (approach axis = world -X) and the held bottle hangs
# straight DOWN (wrist_3 ~ -176 deg), so the Cartesian descent is vertical and the wrist
# clears the table. Derived from move_bottle_to_gripper geometry + wrist_3->virtual_ee_link
# Rz(180); see docs/plan. The MoveIt plan handles the ~180 deg wrist flip from ai_start2.
moveit_insert_orientation_xyzw: [0.483598, -0.515881, -0.483598, 0.515881]
# Collision-check the straight-down Cartesian descent. true = normal MoveIt collision checking
# (safe; may abort if the planning scene's solid table/pad blocks the bottle reaching socket
# depth). false = skip checking for the descent (matches the DP segment, which had none). Set
# false only if collision checking spuriously blocks a legitimate insertion.
# NB (grasp-aware, 2026-07-15): do NOT set false to "rescue" mirrored-grasp candidates --
# a collisions-off trial executed a mirrored descent that physically hit the pad (the
# asymmetric camera-arm holder), aborted mid-descent and wedged the arm for all later
# cycles. The checker's rejection of fully-mirrored spins is genuine.
moveit_insert_descent_collision_check: true
# Guards on the above-socket move's pose_goal global-planner FALLBACK (used only when the seeded-IK
# natural branch fails). The fallback can occasionally return a twisted ~158-waypoint plan (normal
# moves are ~41-57) that lands the arm near-singular and then can't descend. Both guards run BEFORE
# the (potentially ~40 s) move executes, so a bad plan fails the iteration up front instead.
moveit_insert_fallback_max_waypoints: 85   # reject (fail iter) if the fallback plan exceeds this many waypoints
moveit_insert_validate_descent: true       # pre-validate the straight-down descent from the planned above-config first

# Grasp-aware insertion (MoveIt mode only; default off). When true, the insert EE pose is
# DERIVED from the measured bottle-in-hand transform (in_hand_pose_topic, published by Isaac
# at the suction bond: bottle pose in the wrist_3_link frame, frame_id "none" when detached)
# so the bottle ends upright over the socket however it sits in the gripper -- required for
# Isaac's --grip-in-place (no canonical-seat snap). With the canonical seat the derived pose
# reproduces the fixed calibrated one (delta logged each insertion as a regression anchor).
# Falls back to the fixed pose if no valid in-hand transform is available. Overridable via
# the conveyor_feeding.launch.py 'grasp_aware_insertion' arg (bringup: --grasp-aware).
grasp_aware_insertion: false
in_hand_pose_topic: "grasp_in_hand"
# Desired BOTTLE-origin target relative to socket_center (world XYZ, m). [0, 0, 0.078] is what
# the calibrated fixed-pose numbers imply: moveit_insert_offset z (0.09) minus the canonical
# grip_offset (0.012); XY centred on the socket (the 0.015 offset_x is exactly the
# wrist->bottle overhang along the horizontal tool axis, which cancels in bottle terms).
grasp_aware_bottle_offset_xyz: [0.0, 0.0, 0.078]

# --- Physical bottle / suction-tip geometry (source-of-truth constants) -------------------
# These replace magic calibration numbers with measured geometry so the pick surface and the
# fixed-mode insert overhang track the actual bottle radius (multi-bottle support). The bottle
# is rotationally symmetric about its long axis, so its ROLL about that axis is deliberately
# NOT a parameter here -- orientation is handled by the insert's free world-Z spin search.
bottle_radius: 0.0176            # cup-contact radius of the gripped bottle (m)
grip_offset: 0.012               # cup contact offset ALONG the bottle long axis (axial, m; mirrors Isaac GRIP_OFFSET)
# tool-tip-305 (2026-08-08): the real robot measures tool0 -> rigid cup tip = 0.305 m —
# exactly the planning frame virtual_ee_link. The old 0.3013 was the (3.7 mm too short)
# CAD-mesh tip and the delta was misbooked as "cup compression"; the edi_ur meshes and
# every sim model now end at 0.305, so targeting virtual_ee at a surface pose lands the
# rigid tip flush at contact with NO press. See robo-codegen-edi status/tool-tip-305/.
suction_tip_length: 0.305        # tool0 -> rigid cup tip (real-robot measured); informational
suction_tip_compliance: 0.0      # virtual_ee_offset (0.305) - suction_tip_length (0.305)
seat_cup_stretch: 0.0011         # cup stretch at bond

# Pick-depth flush — OBSOLETE since tool-tip-305: there is no compliance gap to press
# through, so enabling this presses the rigid tip pick_depth_compliance metres INTO the
# bottle wall. Keep false. (Knob retained inert pending the real-cell structural pass;
# the codegen-ros-support fork has already deleted it.)
pick_depth_flush: false
pick_depth_compliance: 0.0       # dead while pick_depth_flush is false

# Radius-aware fixed-mode insertion (default off). When true, the NON-grasp-aware insert EE
# pose is derived through the SAME T_we = T_wb * inverse(T_ee_bottle) math as grasp-aware, but
# with a CANONICAL in-hand transform built analytically from the geometry above (radial
# overhang = bottle_radius - suction_tip_compliance + seat_cup_stretch = r + stretch since
# tool-tip-305). At the baseline 0.0176 bottle this reproduces moveit_insert_offset_xyz
# (0.0187) exactly (regression anchor, logged); for other radii the overhang tracks the
# radius. Off => the literal
# moveit_insert_offset_xyz fixed pose (byte-identical legacy). moveit_insert_offset_xyz remains
# the final fallback when no derivation applies. Overridable via the launch 'moveit_insert_radius_aware' arg.
moveit_insert_radius_aware: false

# --- Named SRDF poses (edi_ur/edi_moveit_config/srdf/ur5e_macro.srdf.xacro) ---------------
# There are TWO incompatible box-approach pose sets, one per physical cell, and they put the
# tool on OPPOSITE SIDES of the robot (tool0 y ~ +0.5 vs ~ -0.47). Picking the wrong one does
# not fail cleanly -- the arm sweeps to the other side and finds no bottle -- so the resolved
# set is logged once at startup.
#   defaults below = the "edi" set: the real EDI cell, and equally robo-codegen-edi's sim bin.
#   legacy "isaac" set = wait_slam / above_box_1 / ai_after_pickup: the edi_isaacsim scene's
#   box. edi_isaacsim is being DEPRECATED in favour of robo-codegen-edi; select that set with
#   the launch arg `pose_set:=isaac` (what bringup_sim_stack.sh passes) rather than editing
#   these keys. Ground truth for both sets: robo-codegen-edi ur5e_common.py
#   NAMED_JOINT_CONFIG_EE_POSES.
pose_initial: "near_box"            # one-time startup/home pose before the iteration loop
pose_above_box: "above_box_2"       # staging pose above the pick box (approach + retreat)
pose_after_pickup: "near_box"       # transit pose after a successful pick / insert cleanup
# Canonical DP hand-off configuration. NOT swapped by pose_set and should not be changed: the
# DP policy was trained from this exact configuration and it seeds the moveit-mode insertion IK.
pose_dp_handoff: "ai_start2"
pose_retreat_fallback: "near_box"   # safe_retreat() last resort when pose_above_box is unreachable
pose_dropoff: "inter_floor_4"       # where a bottle is dumped after a failed insertion

# Backend flags (tri-state: auto | "true" | "false"; launch arg overrides these).
# simulation: "true" = Isaac Sim is the primary plant (skip UR /set_io vacuum, trust sim
#   grasp status, flip Isaac drive gains); "false" = real robot / URSim. auto (default)
#   falls back to the use_sim_time heuristic with a one-time WARN -- set explicitly for
#   bag-replay/Gazebo/hybrid deployments.
# mirror_to_isaac: forward vacuum commands to Isaac's /vacuum_gripper/command bridge.
#   auto (default) follows the resolved simulation value; hybrid bring-ups (URSim/real
#   primary + Isaac follower) set "true" explicitly.
simulation: auto
mirror_to_isaac: auto
